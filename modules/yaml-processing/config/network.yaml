# ============================================================
# NETWORK CONFIGURATION — HUB AND SPOKE
#
# network.yaml is the SINGLE OWNER of the core network resources.
# vnet-prod-hub, nsg-prod, afw-prod and vng-prod are fully defined
# here (they are no longer declared in azure.yaml). This file only
# REFERENCES kv-shared-secrets and law-shared-ops through the
# external_references block below.
#
# Top-level sections:
#   defaults, external_references, features, network, connectivity,
#   public_ips, nat, routing, security, gateways, dns,
#   private_endpoints, compute, monitoring, network_watcher,
#   flow_logs, diagnostics.
#
# Tags: every resource inherits the Environment / Project tags from
# `defaults.tags`; the tag map is not duplicated per resource.
#
# CIDR allocation (non-overlapping):
#   Hub:                10.0.0.0/16
#   Spoke - Shared:      10.1.0.0/16
#   Spoke - Payments:    10.2.0.0/16
#   On-prem (S2S VPN):  192.168.0.0/16
# ============================================================

defaults:
  location: "eastus"
  # subscription / resource_group are NOT defaulted here: network resources
  # reference existing ALZ subscriptions/resource groups by logical key via
  # the `references` block (subscription_ref / resource_group_ref).
  tags:
    Environment: "prod"
    Project: "landing-zone"

# These are not defined in any YAML yet; they will be created by a
# later shared-services phase.
external_references:
  log_analytics_workspace: "law-shared-ops"
  key_vault:
    name: "kv-shared-secrets"
    vpn_psk_secret_name: "vpn-psk-onprem"
  vm_ssh_public_key_secret: "vm-admin-ssh-key"

# Hourly-billed components can be switched off to deploy/destroy in
# stages.
#
# Dependencies (turn off with care):
#   firewall=false        -> spoke default routes (next hop 10.0.1.4) break
#   vpn_gateway=false     -> peering use_remote_gateways: true becomes invalid
#   dns_resolver=false    -> the forwarding ruleset has no outbound endpoint
#   private_endpoint=false -> stappdatahub becomes unreachable
#   flow_logs=true        -> requires network_watcher
features:
  nat_gateway: true
  firewall: true
  vpn_gateway: true
  bastion: true
  dns_resolver: true
  private_endpoint: true
  test_vm: true
  flow_logs: true
  route_server: false

# Maps stable logical keys to the existing ALZ subscriptions and resource
# groups defined in azure.yaml. Network resources reference these keys via
# subscription_ref / resource_group_ref; yaml-processing resolves them.
references:
  subscriptions:
    network: "sub-prod-network"
    shared_services: "sub-shared-ops"
    payments: "sub-prod-payment"
  resource_groups:
    network: "rg-prod-network"
    shared_services: "rg-shared-ops"
    payments: "rg-prod-payment-app"

network:
  hub:
    vnet: "vnet-prod-hub"          # owned by network.yaml
    subscription_ref: "network"
    resource_group_ref: "network"
    location: "eastus"
    address_space:
      - "10.0.0.0/16"

    subnets:
      - name: "GatewaySubnet"
        address_prefix: "10.0.0.0/27"
        route_table: "rt-gateway"   # see routing.route_tables

      - name: "AzureFirewallSubnet"
        address_prefix: "10.0.1.0/26"

      - name: "AzureBastionSubnet"
        address_prefix: "10.0.2.0/26"

      - name: "RouteServerSubnet"
        address_prefix: "10.0.3.0/27"

      - name: "snet-hub-shared"
        address_prefix: "10.0.4.0/24"
        nsg: "nsg-prod"
        nat_gateway: "nat-gw-hub"

      - name: "PrivateResolverInbound"
        address_prefix: "10.0.5.0/28"
        delegation: "Microsoft.Network/dnsResolvers"

      - name: "PrivateResolverOutbound"
        address_prefix: "10.0.5.16/28"
        delegation: "Microsoft.Network/dnsResolvers"

  spokes:
    - name: "vnet-spoke-shared"
      display_name: "Shared Services Spoke"
      subscription_ref: "shared_services"
      resource_group_ref: "shared_services"
      location: "eastus"
      address_space:
        - "10.1.0.0/16"
      subnets:
        - name: "snet-shared-app"
          address_prefix: "10.1.0.0/24"
          nsg: "nsg-spoke-shared-app"
          route_table: "rt-spoke-shared"
        - name: "snet-shared-data"
          address_prefix: "10.1.1.0/24"
          nsg: "nsg-spoke-shared-data"
          route_table: "rt-spoke-shared"
          private_endpoint_network_policies: "Enabled"   # Enabled = NSG and route table apply to the private endpoint

    - name: "vnet-spoke-payments"
      display_name: "Payments Spoke (PCI)"
      subscription_ref: "payments"
      resource_group_ref: "payments"
      location: "eastus"
      address_space:
        - "10.2.0.0/16"
      subnets:
        - name: "snet-payments-app"
          address_prefix: "10.2.0.0/24"
          nsg: "nsg-spoke-payments-app"
          route_table: "rt-spoke-payments"
        - name: "snet-payments-data"
          address_prefix: "10.2.1.0/24"
          nsg: "nsg-spoke-payments-data"
          route_table: "rt-spoke-payments"

# ============================================================
# CONNECTIVITY — HUB TO SPOKE PEERING
#
# Peering identity is resolved from the referenced vnet/remote_vnet.
# ============================================================

connectivity:
  peerings:
    - name: "peer-hub-to-spoke-shared"
      vnet: "vnet-prod-hub"
      remote_vnet: "vnet-spoke-shared"
      allow_forwarded_traffic: true
      allow_gateway_transit: true
      use_remote_gateways: false

    - name: "peer-spoke-shared-to-hub"
      vnet: "vnet-spoke-shared"
      remote_vnet: "vnet-prod-hub"
      allow_forwarded_traffic: true
      allow_gateway_transit: false
      use_remote_gateways: true

    - name: "peer-hub-to-spoke-payments"
      vnet: "vnet-prod-hub"
      remote_vnet: "vnet-spoke-payments"
      allow_forwarded_traffic: true
      allow_gateway_transit: true
      use_remote_gateways: false

    - name: "peer-spoke-payments-to-hub"
      vnet: "vnet-spoke-payments"
      remote_vnet: "vnet-prod-hub"
      allow_forwarded_traffic: true
      allow_gateway_transit: false
      use_remote_gateways: true

# ============================================================
# PUBLIC IPs
#
# Each public IP is referenced exactly once by its consumer
# (firewall / vpn gateway / bastion / nat / route server).
# ============================================================

public_ips:
  - name: "pip-afw-prod"
    subscription: "sub-prod-network"
    resource_group: "rg-prod-network"
    location: "eastus"
    sku: "Standard"
    allocation: "Static"
    zones: ["1", "2", "3"]

  - name: "pip-vpn-gw"
    subscription: "sub-prod-network"
    resource_group: "rg-prod-network"
    location: "eastus"
    sku: "Standard"
    allocation: "Static"
    zones: ["1", "2", "3"]

  - name: "pip-bastion-hub"
    subscription: "sub-prod-network"
    resource_group: "rg-prod-network"
    location: "eastus"
    sku: "Standard"
    allocation: "Static"
    zones: ["1", "2", "3"]

  - name: "pip-nat-hub"
    subscription: "sub-prod-network"
    resource_group: "rg-prod-network"
    location: "eastus"
    sku: "Standard"
    allocation: "Static"
    # no zones: NAT gateways are not zone-redundant by default

  - name: "pip-rs-hub"
    subscription: "sub-prod-network"
    resource_group: "rg-prod-network"
    location: "eastus"
    sku: "Standard"
    allocation: "Static"
    zones: ["1", "2", "3"]

# ============================================================
# NAT GATEWAY
#
# Traffic from snet-hub-shared (test VM, future shared tools) is
# not routed through afw-prod, so it needs its own SNAT'd path to
# the internet for patching/updates.
# ============================================================

nat:
  - name: "nat-gw-hub"
    resource_group: "rg-prod-network"
    subscription: "sub-prod-network"
    sku: "Standard"
    public_ip: "pip-nat-hub"

# ============================================================
# ROUTING — ROUTE TABLES / UDRs
#
# Spokes default-route all outbound traffic through afw-prod in the
# hub, so traffic leaving a spoke is always inspected. afw-prod's
# private IP is the first usable address in AzureFirewallSubnet.
# ============================================================

routing:
  route_tables:
    - name: "rt-spoke-shared"
      resource_group: "rg-shared-ops"
      subscription: "sub-shared-ops"
      bgp_route_propagation_enabled: true
      routes:
        - name: "default-via-firewall"
          address_prefix: "0.0.0.0/0"
          next_hop_type: "VirtualAppliance"
          next_hop_ip_address: "10.0.1.4"   # afw-prod private IP
        - name: "onprem-via-firewall"
          address_prefix: "192.168.0.0/16"
          next_hop_type: "VirtualAppliance"
          next_hop_ip_address: "10.0.1.4"

    - name: "rt-spoke-payments"
      resource_group: "rg-prod-payment-app"
      subscription: "sub-prod-payment"
      bgp_route_propagation_enabled: true
      routes:
        - name: "default-via-firewall"
          address_prefix: "0.0.0.0/0"
          next_hop_type: "VirtualAppliance"
          next_hop_ip_address: "10.0.1.4"
        - name: "onprem-via-firewall"
          address_prefix: "192.168.0.0/16"
          next_hop_type: "VirtualAppliance"
          next_hop_ip_address: "10.0.1.4"

    - name: "rt-gateway"
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      # GatewaySubnet route tables MUST keep BGP propagation enabled.
      bgp_route_propagation_enabled: true
      routes:
        - name: "shared-via-firewall"
          address_prefix: "10.1.0.0/16"
          next_hop_type: "VirtualAppliance"
          next_hop_ip_address: "10.0.1.4"
        - name: "payments-via-firewall"
          address_prefix: "10.2.0.0/16"
          next_hop_type: "VirtualAppliance"
          next_hop_ip_address: "10.0.1.4"

  route_server:
    - name: "rs-hub"
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      subnet: "RouteServerSubnet"
      # Confirmed (Microsoft docs): Route Server requires a public IP for
      # its SDN/management BGP endpoint in the GA offering.
      public_ip: "pip-rs-hub"
      branch_to_branch_traffic_enabled: true
      bgp_peers: []

# ============================================================
# SECURITY — NSGs
#
# NSG rule address fields use list form (source_address_prefixes /
# destination_address_prefixes), even for a single value.
# ============================================================

security:
  network_security_groups:
    - name: "nsg-prod"              # owned by network.yaml
      subscription: "sub-prod-network"
      resource_group: "rg-prod-network"
      location: "eastus"
      rules:
        - name: "allow-bastion-inbound"
          priority: 100
          direction: "Inbound"
          access: "Allow"
          protocol: "Tcp"
          source_address_prefixes: ["10.0.2.0/26"]   # AzureBastionSubnet
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["22", "3389"]
        - name: "allow-onprem-mgmt-inbound"
          priority: 110
          direction: "Inbound"
          access: "Allow"
          protocol: "Tcp"
          source_address_prefixes: ["192.168.0.0/16"]  # on-premises via S2S VPN
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["22", "3389"]
        - name: "deny-internet-inbound"
          priority: 4096
          direction: "Inbound"
          access: "Deny"
          protocol: "*"
          source_address_prefixes: ["Internet"]
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["*"]

    - name: "nsg-spoke-shared-app"
      subscription: "sub-shared-ops"
      resource_group: "rg-shared-ops"
      location: "eastus"
      rules:
        - name: "allow-hub-inbound"
          priority: 100
          direction: "Inbound"
          access: "Allow"
          protocol: "*"
          source_address_prefixes: ["10.0.0.0/16"]
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["*"]
        - name: "deny-internet-inbound"
          priority: 4096
          direction: "Inbound"
          access: "Deny"
          protocol: "*"
          source_address_prefixes: ["Internet"]
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["*"]

    - name: "nsg-spoke-shared-data"
      subscription: "sub-shared-ops"
      resource_group: "rg-shared-ops"
      location: "eastus"
      rules:
        - name: "allow-app-subnet-inbound"
          priority: 100
          direction: "Inbound"
          access: "Allow"
          protocol: "*"
          source_address_prefixes: ["10.1.0.0/24"]
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["*"]
        - name: "allow-private-endpoint-inbound"
          priority: 110
          direction: "Inbound"
          access: "Allow"
          protocol: "Tcp"
          source_address_prefixes: ["10.0.0.0/16", "10.1.0.0/24", "10.2.0.0/16"]
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["443"]
        - name: "deny-all-other-inbound"
          priority: 4096
          direction: "Inbound"
          access: "Deny"
          protocol: "*"
          source_address_prefixes: ["*"]
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["*"]

    - name: "nsg-spoke-payments-app"
      subscription: "sub-prod-payment"
      resource_group: "rg-prod-payment-app"
      location: "eastus"
      rules:
        - name: "allow-hub-inbound"
          priority: 100
          direction: "Inbound"
          access: "Allow"
          protocol: "*"
          source_address_prefixes: ["10.0.0.0/16"]
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["443"]
        - name: "deny-internet-inbound"
          priority: 4096
          direction: "Inbound"
          access: "Deny"
          protocol: "*"
          source_address_prefixes: ["Internet"]
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["*"]

    - name: "nsg-spoke-payments-data"
      subscription: "sub-prod-payment"
      resource_group: "rg-prod-payment-app"
      location: "eastus"
      rules:
        - name: "allow-app-subnet-inbound"
          priority: 100
          direction: "Inbound"
          access: "Allow"
          protocol: "*"
          source_address_prefixes: ["10.2.0.0/24"]
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["443"]
        - name: "deny-all-other-inbound"
          priority: 4096
          direction: "Inbound"
          access: "Deny"
          protocol: "*"
          source_address_prefixes: ["*"]
          source_port_range: "*"
          destination_address_prefixes: ["*"]
          destination_port_ranges: ["*"]

# ============================================================
# GATEWAYS
# ============================================================

gateways:
  firewall:
    - name: "afw-prod"              # owned by network.yaml
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      sku_name: "AZFW_VNet"
      sku_tier: "Standard"
      threat_intelligence_mode: "Alert"
      subnet: "AzureFirewallSubnet"
      public_ip: "pip-afw-prod"
      private_ip: "10.0.1.4"        # first usable address in AzureFirewallSubnet
      policy: "fwp-prod"

  firewall_policy:
    - name: "fwp-prod"
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      sku: "Standard"
      rule_collection_groups:
        - name: "rcg-network"
          priority: 200
          collections:
            - name: "rc-spokes-outbound"
              priority: 100
              action: "Allow"
              type: "network"
              rules:
                - name: "allow-spokes-outbound-web"
                  protocols: ["TCP"]
                  source_addresses: ["10.1.0.0/16", "10.2.0.0/16"]
                  destination_addresses: ["*"]
                  destination_ports: ["80", "443"]
            - name: "rc-onprem-to-spokes"
              priority: 200
              action: "Allow"
              type: "network"
              rules:
                - name: "allow-onprem-to-spokes"
                  protocols: ["Any"]
                  source_addresses: ["192.168.0.0/16"]
                  destination_addresses: ["10.1.0.0/16", "10.2.0.0/16"]
                  destination_ports: ["*"]
            - name: "rc-dnat-inbound"
              priority: 100
              action: "Dnat"
              type: "nat"
              # No app VM exists at 10.1.0.4 yet, so this is created disabled.
              enabled: false
              rules:
                - name: "dnat-web-to-shared-app"
                  protocols: ["TCP"]
                  source_addresses: ["*"]
                  destination_public_ip_ref: "pip-afw-prod"
                  destination_ports: ["443"]
                  translated_address: "10.1.0.4"   # shared-services app tier
                  translated_port: "443"

  vpn_gateway:
    - name: "vng-prod"              # owned by network.yaml
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      sku: "VpnGw2AZ"
      generation: "Generation2"
      type: "RouteBased"
      subnet: "GatewaySubnet"
      public_ip: "pip-vpn-gw"
      enable_bgp: true
      bgp_asn: 65001

      local_network_gateways:
        - name: "lng-onprem-hq"
          gateway_address: "203.0.113.25"   # on-prem VPN device, documentation range
          address_space:
            - "192.168.0.0/16"

      connections:
        - name: "conn-onprem-hq"
          type: "IPsec"
          local_network_gateway: "lng-onprem-hq"
          shared_key_secret_name: "vpn-psk-onprem"   # external_references.key_vault

  bastion:
    - name: "bastion-hub"
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      sku: "Standard"
      subnet: "AzureBastionSubnet"
      public_ip: "pip-bastion-hub"
      copy_paste_enabled: true
      file_copy_enabled: true
      tunneling_enabled: true
      ip_connect_enabled: true

# ============================================================
# DNS — PRIVATE RESOLVER, FORWARDING RULESET, PRIVATE ZONES
# ============================================================

dns:
  private_dns_resolver:
    - name: "dnspr-hub"
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      vnet: "vnet-prod-hub"
  resolver_endpoints:
    inbound:
      - name: "inbound-hub"
        resolver: "dnspr-hub"
        subnet: "PrivateResolverInbound"
        private_ip_allocation: "Dynamic"
    outbound:
      - name: "outbound-hub"
        resolver: "dnspr-hub"
        subnet: "PrivateResolverOutbound"
  forwarding_rulesets:
    - name: "ruleset-hub-corp"
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      outbound_endpoint: "outbound-hub"
      forwarding_rules:
        - name: "fwd-corp-example"
          domain_name: "corp.example.com."
          enabled: true
          target_dns_servers:
            - ip_address: "192.168.100.10"
              port: 53
      vnet_links:
        - vnet: "vnet-prod-hub"
        - vnet: "vnet-spoke-shared"
        - vnet: "vnet-spoke-payments"
  private_dns_zones:
    - name: "privatelink.blob.core.windows.net"
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      vnet_links:
        - vnet: "vnet-prod-hub"
        - vnet: "vnet-spoke-shared"
        - vnet: "vnet-spoke-payments"

# ============================================================
# PRIVATE ENDPOINTS
# ============================================================

private_endpoints:
  - name: "pe-stappdata-blob"
    resource_group: "rg-shared-ops"
    subscription: "sub-shared-ops"
    target: "stappdatahub"
    target_subresource: "blob"
    subnet: "snet-shared-data"
    private_dns_zone: "privatelink.blob.core.windows.net"
    is_manual_connection: false

# ============================================================
# COMPUTE — TEST / UTILITY VM
# ============================================================

compute:
  virtual_machines:
    - name: "vm-test-hub"
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      size: "Standard_B2s"
      os: "Linux"
      image:
        publisher: "Canonical"
        offer: "0001-com-ubuntu-server-jammy"
        sku: "22_04-lts-gen2"
        version: "latest"
      os_disk:
        storage_account_type: "Standard_LRS"
        disk_size_gb: 30
        caching: "ReadWrite"
      admin_username: "azureadmin"
      authentication_type: "ssh"
      ssh_public_key_secret: "vm-admin-ssh-key"
      subnet: "snet-hub-shared"
      # NSG is attached at the subnet level (snet-hub-shared -> nsg-prod)
      public_ip: null
      boot_diagnostics_storage: "stnetlogshub"
      data_collection_rule: "dcr-vm-hub"
      extensions: ["AzureMonitorLinuxAgent"]
      role: "Jump box / utility VM to validate hub-spoke routing and firewall rules"

# ============================================================
# MONITORING
# ============================================================

monitoring:
  log_analytics_workspace: "law-shared-ops"   # external_references

  data_collection_rules:
    - name: "dcr-vm-hub"
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      location: "eastus"
      workspace: "law-shared-ops"
      syslog:
        - facility: "auth"
          levels: ["Warning", "Error", "Critical", "Alert", "Emergency"]
        - facility: "daemon"
          levels: ["Warning", "Error", "Critical", "Alert", "Emergency"]

  storage_accounts:
    - name: "stnetlogshub"
      resource_group: "rg-prod-network"
      subscription: "sub-prod-network"
      sku: "Standard_LRS"
      kind: "StorageV2"
      access_tier: "Hot"
      https_only: true
      minimum_tls_version: "TLS1_2"
      purpose: "Network flow logs and firewall log archive"

    - name: "stappdatahub"
      resource_group: "rg-shared-ops"
      subscription: "sub-shared-ops"
      sku: "Standard_LRS"
      kind: "StorageV2"
      access_tier: "Hot"
      https_only: true
      minimum_tls_version: "TLS1_2"
      public_network_access_enabled: false
      allow_nested_items_to_be_public: false
      purpose: "Shared application blob storage accessed only via Private Endpoint"

# ============================================================
# NETWORK WATCHER (one per subscription)
# ============================================================

network_watcher:
  # Azure auto-creates NetworkWatcher_<region> in NetworkWatcherRG per
  # subscription; reference it, do not create it.
  - name: "NetworkWatcher_eastus"
    existing: true
    subscription: "sub-prod-network"
    resource_group: "NetworkWatcherRG"
    location: "eastus"
  - name: "NetworkWatcher_eastus"
    existing: true
    subscription: "sub-shared-ops"
    resource_group: "NetworkWatcherRG"
    location: "eastus"
  - name: "NetworkWatcher_eastus"
    existing: true
    subscription: "sub-prod-payment"
    resource_group: "NetworkWatcherRG"
    location: "eastus"

# ============================================================
# VNET FLOW LOGS
#
# NSG flow logs are retired; VNet flow logs replace them.
#
# A VNet flow log may write to a storage account in a DIFFERENT
# subscription than the VNet, provided the storage account is in the
# same region and same Azure AD tenant (Microsoft Q&A / Azure blog).
# So all three VNets can share stnetlogshub (sub-prod-network, eastus).
# ============================================================

flow_logs:
  - target_vnet: "vnet-prod-hub"
    storage_account: "stnetlogshub"
    retention_days: 30
    traffic_analytics:
      enabled: true
      workspace: "law-shared-ops"
      interval_minutes: 10
  - target_vnet: "vnet-spoke-shared"
    storage_account: "stnetlogshub"
    retention_days: 30
    traffic_analytics:
      enabled: true
      workspace: "law-shared-ops"
      interval_minutes: 10
  - target_vnet: "vnet-spoke-payments"
    storage_account: "stnetlogshub"
    retention_days: 30
    traffic_analytics:
      enabled: true
      workspace: "law-shared-ops"
      interval_minutes: 10

# ============================================================
# DIAGNOSTICS
#
# Diagnostic target identity is resolved from the referenced
# target name.
# ============================================================

diagnostics:
  - target: "afw-prod"
    workspace: "law-shared-ops"
    storage_account: "stnetlogshub"
    categories:
      - "AzureFirewallApplicationRule"
      - "AzureFirewallNetworkRule"

  - target: "vng-prod"
    workspace: "law-shared-ops"
    storage_account: "stnetlogshub"
    categories:
      - "GatewayDiagnosticLog"
      - "TunnelDiagnosticLog"

  - target: "bastion-hub"
    workspace: "law-shared-ops"
    categories:
      - "BastionAuditLogs"





