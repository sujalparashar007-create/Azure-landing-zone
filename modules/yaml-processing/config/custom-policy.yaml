# ============================================================
# CUSTOM POLICIES
#
# Custom policy assignments and custom policy definitions.
# Read by modules/yaml-processing together with azure.yaml.
# Built-in policies stay in azure.yaml.
# ============================================================

tenant:
  policies:
    - name: "Deny Public IP Creation"
      definition: "Deny-PublicIP"
      effect: "Deny"

management_groups:
  - name: "mg-shared-services"
    policies:
      - name: "Deny Public IP"
        definition: "Deny-PublicIP"
        effect: "Deny"

  - name: "mg-network"
    policies:
      - name: "Deny Public IP"
        definition: "Deny-PublicIP"
        effect: "Deny"

  - name: "mg-network-prod"
    policies:
      - name: "Require NSG on Subnets"
        definition: "Require NSG on subnet"

  - name: "mg-production"
    policies:
      - name: "Deny Public IP"
        definition: "Deny-PublicIP"
        effect: "Deny"

  - name: "mg-prod-payments"
    policies:
      - name: "Require Encryption"
        definition: "Require encryption"
        effect: "Audit"

# Custom policy definitions used by the assignments above.
custom_policy_definitions:
  Deny-PublicIP:
    display_name: "Deny Public IP Address Creation"
    policy_rule:
      if:
        field: "type"
        equals: "Microsoft.Network/publicIPAddresses"
      then:
        effect: "[parameters('effect')]"
    parameters:
      effect:
        type: "String"
        metadata:
          displayName: "Effect"
          description: "Enable or disable the execution of the policy"
        allowedValues: ["Audit", "Deny", "Disabled"]
        defaultValue: "Deny"

  Require NSG on subnet:
    display_name: "Require NSG on Subnet"
    policy_rule:
      if:
        allOf:
          - field: "type"
            equals: "Microsoft.Network/virtualNetworks/subnets"
          - field: "Microsoft.Network/virtualNetworks/subnets/networkSecurityGroup.id"
            exists: "false"
      then:
        effect: "[parameters('effect')]"
    parameters:
      effect:
        type: "String"
        metadata:
          displayName: "Effect"
          description: "Enable or disable the execution of the policy"
        allowedValues: ["Audit", "Deny", "Disabled"]
        defaultValue: "Deny"

  Require encryption:
    display_name: "Require Storage Account Encryption"
    policy_rule:
      if:
        allOf:
          - field: "type"
            equals: "Microsoft.Storage/storageAccounts"
          - field: "Microsoft.Storage/storageAccounts/encryption.services.blob.enabled"
            notEquals: "true"
      then:
        effect: "[parameters('effect')]"
    parameters:
      effect:
        type: "String"
        metadata:
          displayName: "Effect"
          description: "Enable or disable the execution of the policy"
        allowedValues: ["Audit", "Deny", "Disabled"]
        defaultValue: "Deny"