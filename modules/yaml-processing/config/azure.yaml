tenant:
  id: "59cbaf84-4354-45ff-9649-b586ddfe9335"
  display_name: "Contoso"

  # --- Tenant / Root-level governance ---
  iam:
    "Reader":
      - "sujalparashar700@gmail.com"

  # --- Corporate budget configurations ---
  budgets:
    security-budget:
      amount: 500
      currency: "USD"
      time_grain: "Monthly"
      start_date: "2026-10-01T00:00:00Z"
      thresholds: [50, 70, 90, 100]
      notifications:
        - type: "Email"
          recipients:
            - "sujalparashar700@gmail.com"

    platform-budget:
      amount: 2500
      currency: "USD"
      time_grain: "Monthly"
      start_date: "2026-10-01T00:00:00Z"
      thresholds: [80, 100]
      notifications:
        - type: "Email"
          recipients:
            - "sujalparashar700@gmail.com"


# --- IAM user directory object IDs ---
# External (#EXT#) users have a directory UPN that differs from their
# sign-in email, so we map the sign-in email to its Entra ID object id.
users:
  "sujalparashar700@gmail.com":
    object_id: "7452eab3-30b8-42b8-a9d4-a3d07a495ad3"


# ============================================================
# MANAGEMENT GROUP HIERARCHY
# ============================================================

management_groups:

  # ----------------------------------------------------------
  # LEVEL 1 - Platform
  # ----------------------------------------------------------
  - name: "mg-platform"
    display_name: "Core Platform"
    parent: "tenant-root"

    policies:
      - name: "Require Azure Resource Locations"
        definition: "Allowed locations"
        parameters:
          listOfAllowedLocations:
            - "East US"
            - "West Europe"
        effect: "Deny"

      - name: "Require Resource Tags"
        definition: "Require a tag on resources"
        parameters:
          tagName: "Environment"
        effect: "Deny"

    iam:
      "Reader":
        - "sujalparashar700@gmail.com"

      "Security Admin":
        - "sujalparashar700@gmail.com"

    resource_groups: []

    subscriptions: []

    children:

      # ------------------------------------------------------
      # LEVEL 2 - Shared Services
      # ------------------------------------------------------
      - name: "mg-shared-services"
        display_name: "Core Shared Infrastructure"

        iam:
          "Reader":
            - "sujalparashar700@gmail.com"

        subscriptions:

          # --------------------------------------------------
          # SAMPLE SUBSCRIPTION 1
          # --------------------------------------------------
          - name: "sub-shared-ops"
            display_name: "Shared Operations"
            billing_scope_id: /providers/Microsoft.Billing/billingAccounts/e1ea7498-fcb8-5fa0-d431-658e1435a459:379eacb6-0df7-4782-bc03-70d367419cbc_2019-05-31/billingProfiles/EQDC-YZLS-BG7-PGB/invoiceSections/cd11e743-b512-4dc5-a954-d56353d804da

            budget_references:
              - "security-budget"
              - "platform-budget"

            resource_groups:

              - name: "rg-shared-ops"
                location: "eastus"

            iam:
              "Key Vault Administrator":
                - "sujalparashar700@gmail.com"


      # ------------------------------------------------------
      # LEVEL 2 - Network
      # ------------------------------------------------------
      - name: "mg-network"
        display_name: "Core Network Infrastructure"

        policies:
          - name: "Allowed Locations"
            definition: "Allowed locations"
            parameters:
              listOfAllowedLocations:
                - "East US"
                - "West Europe"
            effect: "Deny"

        iam:
          "Network Contributor":
            - "sujalparashar700@gmail.com"

        subscriptions: []

        children:

          # --------------------------------------------------
          # LEVEL 3 - Production Network
          # --------------------------------------------------
          - name: "mg-network-prod"
            display_name: "Production Network Controls"

            subscriptions:

              # ----------------------------------------------
              # SAMPLE SUBSCRIPTION 2
              # ----------------------------------------------
              - name: "sub-prod-network"
                display_name: "Production Network"
                billing_scope_id: /providers/Microsoft.Billing/billingAccounts/e1ea7498-fcb8-5fa0-d431-658e1435a459:379eacb6-0df7-4782-bc03-70d367419cbc_2019-05-31/billingProfiles/EQDC-YZLS-BG7-PGB/invoiceSections/cd11e743-b512-4dc5-a954-d56353d804da

                resource_groups:

                  - name: "rg-prod-network"
                    location: "eastus"

      # ------------------------------------------------------
      # LEVEL 2 - Production
      # ------------------------------------------------------
      - name: "mg-production"
        display_name: "Production Workloads"

        policies:

          - name: "Allowed Locations"
            definition: "Allowed locations"
            parameters:
              listOfAllowedLocations:
                - "East US"
                - "West Europe"
            effect: "Deny"

        iam:
          "Reader":
            - "sujalparashar700@gmail.com"

        subscriptions: []

        children:

          # --------------------------------------------------
          # LEVEL 3 - Production Applications
          # --------------------------------------------------
          - name: "mg-prod-apps"
            display_name: "Production Business Applications"

            subscriptions: []

            children:

              # ----------------------------------------------
              # LEVEL 4 - Payments
              # ----------------------------------------------
              - name: "mg-prod-payments"
                display_name: "PCI Compliance Environment"

                policies:

                  - name: "PCI Allowed Locations"
                    definition: "Allowed locations"
                    parameters:
                      listOfAllowedLocations:
                        - "East US"
                    effect: "Deny"

                subscriptions:

                  # ------------------------------------------
                  # SAMPLE SUBSCRIPTION 3
                  # ------------------------------------------
                  - name: "sub-prod-payment"
                    display_name: "Production Payment Workload"
                    billing_scope_id: /providers/Microsoft.Billing/billingAccounts/e1ea7498-fcb8-5fa0-d431-658e1435a459:379eacb6-0df7-4782-bc03-70d367419cbc_2019-05-31/billingProfiles/EQDC-YZLS-BG7-PGB/invoiceSections/cd11e743-b512-4dc5-a954-d56353d804da

                    budget_references:
                      - "security-budget"

                    resource_groups:

                      - name: "rg-prod-payment-app"
                        location: "eastus"

                        iam:
                          "Contributor":
                            - "sujalparashar700@gmail.com"